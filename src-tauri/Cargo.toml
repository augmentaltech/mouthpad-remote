[package]
name = "remote-controller"
version = "0.1.0"
description = "Forwards this computer's mouse and keyboard to a MouthPad over HIDLoopback on its USB CDC proto port."
authors = ["Augmental"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mouthpad-proto = { git = "ssh://git@github.com/augmentaltech/mouthpad-proto", branch = "main" }
prost = "0.13.5"
serialport = { version = "4", features = ["usbportinfo-interface"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37.0", features = ["sync"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
core-foundation-sys = "0.8"
